<link rel="stylesheet" href="css/responsive.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<header>

<nav class="navbar">

<div class="logo">

<h2>BABA <span>TECH HUB</span></h2>

</div>

<ul class="nav-links">

<li><a href="index.html">Home</a></li>

<section class="login-page">

<div class="login-box">

<h2>Welcome Back</h2>

<p>

Login to your Baba Tech Hub Account

</p>

<form>

<div class="input-box">

<i class="fa-solid fa-envelope"></i>

<input
type="email"
placeholder="Email Address"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
placeholder="Password"
required>

</div>

<div class="remember">

<label>

<input type="checkbox">

Remember Me

</label>

<a href="#">

Forgot Password?

</a>

</div>

<button
class="login-button"
type="submit">

Login

</button>

<p class="register-text">

Don't have an account?

<a href="signup.html">

Create Account

</a>

</p>

</form>

</div>

</section>

<footer>

<div class="footer-bottom">

© 2026 BABA TECH HUB

</div>

</footer>

<script src="js/script.js"></script>

</body>
